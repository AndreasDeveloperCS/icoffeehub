name: Deploy iCoffeeHub

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: icoffeehub-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - icoffeehub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use supported Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show environment
        run: |
          echo "Runner: $(hostname)"
          echo "User: $(whoami)"
          node -v
          npm -v
          pm2 -v

      - name: Deploy files
        run: |
          APP_PATH="${{ vars.APP_PATH }}"

          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            echo "Using passwordless sudo to prepare deploy directory"
            sudo mkdir -p "$APP_PATH"
            sudo chown -R "$(id -u):$(id -g)" "$APP_PATH"
          else
            mkdir -p "$APP_PATH"
          fi

          if [ ! -w "$APP_PATH" ]; then
            echo "Deploy path is not writable by runner user: $APP_PATH"
            ls -ld "$APP_PATH" || true
            id || true
            exit 1
          fi

          rsync -az --delete --no-owner --no-group --no-perms \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            --exclude="backend/node_modules" \
            --exclude="backend/dist" \
            --exclude="frontend/node_modules" \
            --exclude="frontend/.next" \
            --exclude=".env" \
            --exclude=".env.local" \
            --exclude=".env.production" \
            ./ "$APP_PATH/"

      - name: Write backend environment file
        working-directory: ${{ vars.APP_PATH }}/backend
        run: |
          umask 077
          cat > .env <<'EOF'
          NODE_ENV=${{ vars.NODE_ENV }}
          PORT=${{ vars.BACKEND_PORT }}
          MONGODB_URI=${{ vars.MONGODB_URI }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=${{ vars.JWT_EXPIRES_IN }}
          CORS_ORIGIN=${{ vars.CORS_ORIGIN }}
          CORS_ORIGIN_DEV=${{ vars.CORS_ORIGIN_DEV }}
          EOF

      - name: Install and build backend
        working-directory: ${{ vars.APP_PATH }}/backend
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            echo "No lockfile found in backend; falling back to npm install"
            npm install --no-audit --no-fund
          fi
          npm run build

      - name: Install and build frontend
        working-directory: ${{ vars.APP_PATH }}/frontend
        # Browser API requests stay same-origin; only the server uses this address.
        env:
          API_URL: http://127.0.0.1:${{ vars.BACKEND_PORT }}/api
          NEXT_PUBLIC_SITE_URL: ${{ vars.CORS_ORIGIN }}
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            echo "No lockfile found in frontend; falling back to npm install"
            npm install --no-audit --no-fund
          fi
          npm test
          npm run build

          if grep -rqE "(localhost|127\.0\.0\.1):[0-9]+/api" .next/static; then
            echo "Frontend browser bundle contains a local backend address"
            exit 1
          fi

      - name: Start or restart application
        working-directory: ${{ vars.APP_PATH }}
        env:
          API_URL: http://127.0.0.1:${{ vars.BACKEND_PORT }}/api
        run: |
          set -euo pipefail

          PM2_BIN="$(command -v pm2)"
          export PM2_HOME="${PM2_HOME:-$HOME/.pm2}"
          pm2_cmd() { "$PM2_BIN" "$@"; }

          pm2_cmd startOrReload ecosystem.config.js --only icoffeehub-backend,icoffeehub-frontend --update-env
          pm2_cmd save

      - name: Verify PM2 processes are online
        working-directory: ${{ vars.APP_PATH }}
        run: |
          PM2_BIN="$(command -v pm2)"
          export PM2_HOME="${PM2_HOME:-$HOME/.pm2}"
          pm2_cmd() { "$PM2_BIN" "$@"; }

          for app in icoffeehub-backend icoffeehub-frontend; do
            echo "Waiting for PM2 app: ${app}"
            for i in {1..15}; do
              if pm2_cmd describe "$app" | grep -q "status.*online"; then
                echo "${app} is online"
                break
              fi

              if [ "$i" -eq 15 ]; then
                echo "${app} failed to reach online state"
                pm2_cmd describe "$app" || true
                pm2_cmd logs "$app" --lines 80 --nostream || true
                exit 1
              fi

              sleep 2
            done
          done

          pm2_cmd list

      - name: Verify backend is responding
        run: |
          set -euo pipefail

          PM2_BIN="$(command -v pm2)"
          export PM2_HOME="${PM2_HOME:-$HOME/.pm2}"

          # Longer window than a fresh DB connection (e.g. a resuming Atlas cluster) can need.
          if ! curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:${{ vars.BACKEND_PORT }}/api/health >/dev/null; then
            echo "Backend did not respond in time; recent logs:"
            "$PM2_BIN" logs icoffeehub-backend --lines 100 --nostream || true
            exit 1
          fi
          echo "iCoffeeHub backend is responding on port ${{ vars.BACKEND_PORT }}"

      - name: Verify frontend is responding
        run: |
          set -euo pipefail

          PM2_BIN="$(command -v pm2)"
          export PM2_HOME="${PM2_HOME:-$HOME/.pm2}"

          if ! curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000 >/dev/null; then
            echo "Frontend did not respond in time; recent logs:"
            "$PM2_BIN" logs icoffeehub-frontend --lines 100 --nostream || true
            exit 1
          fi
          echo "iCoffeeHub frontend is responding on port 3000"

      - name: Verify frontend authentication API routing
        run: |
          set -euo pipefail
          # Invalid payloads verify routing and validation without creating accounts.
          for endpoint in register login; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              -H 'Content-Type: application/json' -d '{}' \
              "http://127.0.0.1:3000/api/auth/${endpoint}")"
            if [ "$status" != "400" ]; then
              echo "Authentication route ${endpoint} returned ${status}; expected validation status 400"
              exit 1
            fi
          done

      - name: Install and reload Nginx
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/deploy-icoffeehub-nginx
