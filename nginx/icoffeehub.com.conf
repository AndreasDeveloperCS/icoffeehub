map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name icoffeehub.com www.icoffeehub.com;
    return 301 https://icoffeehub.com$request_uri;

    error_log /var/www/logs/icoffeehub/icoffeehub.com.error.log;
    access_log /var/www/logs/icoffeehub/icoffeehub.com.access.log;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name icoffeehub.com;

    ssl_certificate /etc/letsencrypt/live/icoffeehub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/icoffeehub.com/privkey.pem;

    client_max_body_size 50M;

    charset utf-8;
    gzip on;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/css text/xml application/javascript text/plain application/json image/svg+xml image/x-icon;
    gzip_comp_level 1;

    # NestJS API (global prefix /api).
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
    }

    # Next.js app (SSR, served by `next start` behind pm2). Next serves its
    # own hashed static assets under /_next/static with immutable
    # Cache-Control headers, so no extra caching rules are needed here.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    error_log /var/www/logs/icoffeehub/icoffeehub.com.error.log;
    access_log /var/www/logs/icoffeehub/icoffeehub.com.access.log;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.icoffeehub.com;

    ssl_certificate /etc/letsencrypt/live/icoffeehub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/icoffeehub.com/privkey.pem;

    return 301 https://icoffeehub.com$request_uri;

    error_log /var/www/logs/icoffeehub/icoffeehub.com.error.log;
    access_log /var/www/logs/icoffeehub/icoffeehub.com.access.log;
}
